<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>🍩 Meals</title>
    <style>
        .home_button_styling {
            padding: 10px 15px;
            font-size: 2vh;
            cursor: pointer;
            font-weight: bold;
            border-radius: 2vh;
            border: solid;
            color: #6b6b6b;
            background-color: #ffffff;
        }

        .home_button_area {
            position: absolute;
            top: 1vh;
            left: 1vh;
            color: #ffffff;
            background-color: #ffffff;
        }

        body {
            min-height: 50vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: auto;
            max-width: 100vh;
            gap: 3vh;
            background-color: #f3ffff;
        }

        h1 {
            font-weight: bold;
            font-style: italic;
            font-size: 5vh;
            color: #ffac33;
            margin-top: 0;
        }

        .title_container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            max-width: 100vh;
        }

        .meal_row {
            display: flex;
            flex-direction: row;
            gap: 2px;
        }

        button {
            padding: 10px 40px;
            font-size: 36px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 2vh;
            color: #ffac33;
            background: #e2ffff;
            border: none;
        }

        .recipe_id,
        .recipe_name,
        .calories,
        .protein,
        .carbs,
        .fats {
            padding: 2px 5px;
            display: flex;
            align-items: center;
            justify-content: left;
            font-size: 2.1vh;
            font-weight: bold;
            border-radius: 2vh;
            border-style: inset;
            border-width: 3px;
            padding-left: 10px;
            background-color: #e2ffff;
        }

        .recipe_id {
            border-color: #a67c52;
            color: #a67c52;
            width: 6vh;
        }

        .recipe_name {
            border-color: #b0b0b0;
            color: #ffac33;
            width: 22vh;
        }

        .calories {
            border-color: #ff5733;
            color: #ff5733;
            width: 14vh;
        }

        .protein {
            border-color: #b22222;
            color: #b22222;
            width: 12vh;
        }

        .carbs {
            border-color: #e2b07a;
            color: #e2b07a;
            width: 12vh;
        }

        .fats {
            border-color: #ffe066;
            color: #ffe066;
            width: 8vh;
        }

        .meals_container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1vh;
        }

        input {
            width: 10vh;
            text-align: center;
            font-weight: bold;
            padding: 10px 20px;
            font-size: 24px;
            color: #94aba3;
            border-radius: 1vh;
        }

        .header_border {
            border: 1px solid #8a4b38;
            width: 100%;
        }

        /* styling for the favorite button */
        #favorite_meal_button {
            background: #fff7cc;
            color: #d49e00;
        }

        /* error text styling */
        #error_label {
            min-height: 1.5em;
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <!-- Banner -->
    <div class="title_container">
        <h1>ATE SOMETHING?</h1>
    </div>

    <div class="home_button_area">
        <button type="button" onclick="window.location.href='/account'" class="home_button_styling">
            ⏎
        </button>
    </div>

    <div class="meal_row">
        <input type="text" id="id_entry" placeholder="🏷️ ID">
    </div>

    <div class="meal_row">
        <button id="log_meal_button">L🍩G IT!</button>
        <button id="favorite_meal_button">★ Favorite</button>
    </div>

    <!-- keep error label here to not mess with formatting -->
    <div id="error_label"></div>

    <!-- FAVORITES SECTION -->
    <div class="meal_row">
        <p class="recipe_id">🏷️ ID</p>
        <p class="recipe_name">🍽️ Recipe Name</p>
        <p class="calories">🔥 Calories</p>
        <p class="protein">🥩 Protein</p>
        <p class="carbs">🍞 Carbs</p>
        <p class="fats">🧈 Fats</p>
    </div>

    <h2>Favorite Meals</h2>
    <div id="favorites_container" class="meals_container">
        <div class="meal_row">
        </div>
        <hr class="header_border">
        </hr>
    </div>

    <!-- ALL MEALS SECTION -->
    <h2>All Meals</h2>
    <div id="meals_container" class="meals_container">
        <div id="" class="meal_row">
        </div>
        <hr class="header_border">
        </hr>
    </div>

    <script src="logmeals.js"></script>
</body>

</html>
