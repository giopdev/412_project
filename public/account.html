<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>🍩 Account</title>
    <style>
        body {
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: auto;
            max-width: 100vh;
            gap: 3vh;
            background-color: #f3ffff;
        }

        h1 {
            font-weight: bold;
            font-style: italic;
            font-size: 5vh;
            color: #ffac33;
            margin-top: 0;
        }

        h2 {
            font-weight: bold;
            font-size: 5vh;
            color: #677772;
            margin-top: 0;
            margin-bottom: 0;
        }

        p {
            font-size: 36px;
            font-weight: bold;
            font-style: italic;
            color: #677772;
            margin-top: 0;
            margin-bottom: 0;
        }

        .title_container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            max-width: 100vh;
        }

        .button_row {
            display: flex;
            flex-direction: row;
            gap: 24px;
        }

        button {
            padding: 10px 40px;
            font-size: 24px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 2vh;
            color: #6b6b6b;
            background: #e2ffff;
            border: none;
        }
    </style>
</head>

<body>
    <!-- Show logged in view -->
    <div class="title_container">
        <h1>Welcome back!</h1>
    </div>

    <div class="button_row">
        <button type="button" onclick="window.location.href='/logmeals'">
            Log Meals
        </button>
        <button type="button" onclick="window.location.href='/meals'">
            View My Meals
        </button>
    </div>
</body>

</html>
