<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>🍩 Account</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <style>
        body {
            background-color: #f3ffff;
        }

        header {
            position: absolute;
            top: 1vh;
            left: 1vh;

            display: flex;
            
        }

        #profile-picture {
            cursor: pointer;
            aspect-ratio: 1;
            border: 3px solid gray;
            border-radius: 10px;
            width: 6vh;
        }

        .profile_styling {
			padding: 10px 15px;
			font-size: 2vh;
			font-weight: bold;
			border-radius: 2vh;
			color: #6b6b6b;

            
		}

		.profile_area {
			position: absolute;
			top: 1vh;
			left: 1vh;
		}

        #update_profile {
            margin: auto 20px;

            flex-direction: column;


            #submitButton {
                width: 50%;
                max-height: 2vh;
                margin-top: 1vh;
            }
        }

        main {
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: auto;
            margin-top: 6vh;
            max-width: 100vh;
            gap: 3vh;
        }

        h1 {
            font-weight: bold;
            font-style: italic;
            font-size: 5vh;
            color: #ffac33;
            margin-top: 0;
        }

        h2 {
            font-weight: bold;
            font-size: 5vh;
            color: #677772;
            margin-top: 0;
            margin-bottom: 0;
        }

        h3 {
            font-weight: bold;
            font-size: 4vh;
            color: #677772;
            margin-top: 0;
            margin-bottom: .3em;
        }

        p {
            font-size: 36px;
            font-weight: bold;
            font-style: italic;
            color: #677772;
            margin-top: 0;
            margin-bottom: 0;
        }

        .title_container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            max-width: 100vh;
        }

        .button_row {
            display: flex;
            flex-direction: row;
            gap: 24px;
            justify-content: center;

            width: 55%;
        }

        button {
            flex: 1;
            padding: 10px 40px;
            font-size: 24px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 2vh;
            color: #6b6b6b;
            background: #e2ffff;
            /*border none*/
            border: 2px solid rgb(0, 140, 165);
        }

        #logout_button {
            margin-top: 5vh;
            max-width: 50%;
            background-color: #c2dddd;
        }

        .goals-outer-container {
            border: 4px solid rgb(101, 101, 101);
            width: 75%;
            border-radius: 15px;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .goals-container {
            border: 4px solid rgb(168, 168, 168);
            border-radius: 15px;
            width: 100%;
            display: grid;
            grid-template-columns: auto 1fr auto;
            box-sizing: border-box;
            padding: 10px;
            column-gap: 10px;
            place-items: center;
        }


        .divider {
            grid-column: 1 / 4;
            width: 100%;
            border: none;
            border-top: 2px dashed rgb(168, 168, 168);;
        }
        .progress-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
        }

        .progress-bar-container {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            height: 50%;
            border: 1px solid #ccc;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            transition: width 1s ease;
        }

        .goal-progress-label {
            font-size: 1em;
            margin-left: 0.5em;
        }

        #calories-bar {
            background-color: #ff5733;            
        }

        #protein-bar {
            background-color: #b22222;            
        }

        #carbs-bar {
            background-color: #e2b07a;            
        }

        #fat-bar {
            background-color: #ffe066;            
        }

    </style>
</head>

<body>
    <header>
        <img id="profile-picture" src="images/default.png" alt=""/>
        <div id="update_profile">
            <input type="file" id="newPhoto" name="filename" accept="image/png">
            <input type="submit" id="submitButton" value="Update Profile">
        </div>
    </header>
    
    
    <main>
        <!-- Show logged in view -->
        <div class="title_container">
            <h1 id="welcomeMsg">Welcome back!</h1>
        </div>

        <div class="button_row">
            <button type="button" onclick="window.location.href='/logmeals'">
                Log Meals
            </button>
            <button type="button" onclick="window.location.href='/meals'">
                View My Meals
            </button>
        </div>
        <div class="goals-outer-container">
            <h3>Today's Progress</h3>
            <div id="goals-container" class="goals-container">
                <p class="fancy-label calories">🔥 Calories</p>
                <div class="progress-container">
                    <div class="progress-bar-container">
                        <div id="calories-bar" class="progress-bar"></div>
                    </div>
                </div>
                <p id="calories-count" class="goal-progress-label"></p>

                <hr class="divider">
                
                <p class="fancy-label protein">🥩 Protein</p>
                <div class="progress-container">
                    <div class="progress-bar-container">
                        <div id="protein-bar" class="progress-bar"></div>
                    </div>
                </div>
                <p id="protein-count" class="goal-progress-label"></p>
                
                <hr class="divider">
                
                <p class="fancy-label carbs">🍞 Carbs</p>
                <div class="progress-container">
                    <div class="progress-bar-container">
                        <div id="carbs-bar" class="progress-bar"></div>
                    </div>
                </div>
                <p id="carbs-count" class="goal-progress-label"></p>
                
                <hr class="divider">
                
                <p class="fancy-label fats">🧈 Fats</p>
                <div class="progress-container">
                    <div class="progress-bar-container">
                        <div id="fat-bar" class="progress-bar"></div>
                    </div>
                </div>
                <p id="fat-count" class="goal-progress-label"></p>
            </div>
        </div>
        <div class="button_row">
            <button id="logout_button" type="button">
                Log Out
            </button>
        </div>
    </main>

    <!-- load the profile photo with script -->
    <script src="account.js"></script>
    
    
</body>

</html>
