<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>🍩 Meals</title>
	<style>
		body {
			min-height: 50vh;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			margin: auto;
			max-width: 100vh;
			gap: 3vh;
			background-color: #f3ffff;
		}

		h1 {
			font-weight: bold;
			font-style: italic;
			font-size: 5vh;
			color: #ffac33;
			margin-top: 0;
		}

		h2 {
			font-weight: bold;
			font-size: 5vh;
			color: #677772;
			margin-top: 0;
			margin-bottom: 0;
		}

		p {
			font-size: 36px;
			font-weight: bold;
			font-style: italic;
			color: #677772;
			margin-top: 0;
			margin-bottom: 0;
		}

		.title_container {
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			max-width: 100vh;
		}

		.meal_row {
			display: flex;
			flex-direction: row;
			gap: 2px;
		}

		button {
			padding: 10px 40px;
			font-size: 24px;
			cursor: pointer;
			font-weight: bold;
			border-radius: 2vh;
			color: #6b6b6b;
		}

		.add_meal_button {
			width: 3vh;
			height: 3vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 1vh 1vh;
			font-size: 2vh;
			cursor: pointer;
			font-weight: bold;
			border-radius: 50%;
			color: #6b6b6b;
		}

		.meal {
			width: auto;
			background-color: #e2ffff;
			border-color: #6b6b6b;
			color: #ffac33;
		}

		.recipe_name {
			width: 22vh;
			background-color: #e2ffff;
			border-color: #b0b0b0;
			color: #ffac33;
		}

		.servings {
			width: 12vh;
			background-color: #e2ffff;
			border-color: #8bc34a;
			color: #8bc34a;
		}


		.calories {
			width: 14vh;
			background-color: #e2ffff;
			border-color: #ff5733;
			color: #ff5733;
		}

		.protein {
			width: 12vh;
			background-color: #e2ffff;
			border-color: #b22222;
			color: #b22222;
		}

		.carbs {
			width: 12vh;
			background-color: #e2ffff;
			border-color: #e2b07a;
			color: #e2b07a;
		}

		.fats {
			width: 8vh;
			background-color: #e2ffff;
			border-color: #ffe066;
			color: #ffe066;
		}

		.recipe_name,
		.calories,
		.protein,
		.carbs,
		.fats,
		.meal,
		.servings {
			padding: 2px 5px;
			display: flex;
			align-items: center;
			justify-content: left;
			font-size: 2.1vh;
			font-weight: bold;
			border-radius: 2vh;
			border-style: inset;
			border-width: 3px;
			padding-left: 10px;
		}

		.meals_container {
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			gap: 1vh;
		}

		.header_border {
			border: 1px solid;
			border-color: #8a4b38;
			width: 100%;
		}
	</style>
</head>

<body>
	<!-- Banner -->
	<div class="title_container">
		<h1>YOUR F🍩🍩D!</h1>
	</div>
	<div id="meals_container" class="meals_container">
		<div class="meal_row">
			<p class="recipe_name">🍽️ Recipe Name</p>
			<p class="servings">🥄 Servings</p>
			<p class="calories">🔥 Calories</p>
			<p class="protein">🥩 Protein</p>
			<p class="carbs">🍞 Carbs</p>
			<p class="fats">🧈 Fats</p>
		</div>
		<hr class="header_border">
		</hr>
	</div>

	<button id="add_meal_button" class="add_meal_button">+</button>

	<script src="meals.js"></script>

</html>
