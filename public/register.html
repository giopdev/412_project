<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>F🍩🍩D! - Register</title>
</head>
<style>
	body {
		min-height: 50vh;
		display: flex;
		flex-direction: column;
		justify-content: center;
		align-items: center;
		margin: auto;
		max-width: 100vh;
		gap: 2vh;
		background-color: #f3ffff;
	}

	h1 {
		font-weight: bold;
		font-size: 5vh;
		margin-bottom: 1vh;
		color: #677772;
	}

	.button_list {
		display: flex;
		flex-direction: row;
		gap: 24px;
	}

	button {
		padding: 10px 40px;
		font-size: 24px;
		cursor: pointer;
		font-weight: bold;
		border-radius: 2vh;
		color: #6b6b6b;
	}

	.home_button_styling {
		padding: 10px 15px;
		font-size: 2vh;
		cursor: pointer;
		font-weight: bold;
		border-radius: 2vh;
		color: #6b6b6b;
	}

	input {
		font-weight: bold;
		padding: 10px 20px;
		font-size: 24px;
		color: #94aba3;
		border-radius: 1vh;
	}

	.home_button_area {
		position: absolute;
		top: 1vh;
		left: 1vh;
	}
</style>

<body>

	<!-- Prompt user for registration -->
	<h1>Register</h1>
	<input type="text" id="register_fullname" placeholder="name">
	<input type="text" id="register_email" placeholder="email">
	<input type="text" id="register_username" placeholder="username">
	<input type="password" id="register_password" placeholder="password">

	<div class="home_button_area">
		<button type="button" onclick="window.location.href='/'" class="home_button_styling">⏎</button>
	</div>

	<div class="button_list">
		<button type="button" id="doRegister">Create It!</button>
	</div>
	
	<script>
		document.getElementById('doRegister').addEventListener('click', async () => {
		const fullName = document.getElementById('register_fullname').value.trim();
		const email = document.getElementById('register_email').value.trim();
		const username = document.getElementById('register_username').value.trim();
		const password = document.getElementById('register_password').value;
		
		if(!fullName || !email || !username || !password) {
			return alert('ALL FIELDS REQUIRED!');
		}
		
		try {
			const res = await fetch('/register', {
				method: 'POST',
				headers: {'Content-Type': 'application/json'},
				body: JSON.stringify({register_fullname: fullName, register_email: email, register_username: username, register_password: password}),
			});
			
			if(res.ok){
				alert('Registered! Going back to homepage');
				window.location = '/';
			} else {
				const {error} = await res.json();
				alert (error || 'Registration failed');
			}
		} catch (err) {
			console.error(err);
			alert('Network error');
		}
	});
	</script>
</body>

</html>
